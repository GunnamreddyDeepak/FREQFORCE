# A generic, single database configuration for KISANQUEUE V2.

[alembic]
# Path to migration scripts (relative to this configuration file)
script_location = %(here)s/alembic

# Template used to generate migration file names
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# Prepend application root to sys.path so app modules can be imported
prepend_sys_path = %(here)s
path_separator = os

# Timezone configuration for timestamps in migrations
timezone = UTC

# Max length of characters for "slug" field
truncate_slug_length = 40

# Set to 'true' to run the environment during the 'revision' command
revision_environment = false

# Set to 'true' to allow .pyc and .pyo files without a .py counterpart
sourceless = false

# Database connection URL (Dynamically overridden by app.core.config.settings in env.py)
sqlalchemy.url = postgresql+psycopg://postgres:placeholder@localhost:5432/kisanqueue

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
